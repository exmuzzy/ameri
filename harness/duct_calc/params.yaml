# Параметры расчётки, которые дополняют прототип duct-calc без правки его кода.
# Слова ищутся как подстроки в тексте позиции в нижнем регистре, поэтому здесь только
# сочетания, которые не встречаются в названиях собственных изделий из ПП: не «клапан»
# (дроссель- и обратные клапаны делаем сами), не «щит» (есть в «защитная»), не «шкаф»
# (бывают вытяжные шкафы из ПП). Проверка слов — docs/harness-proposals.md, П9.

# Покупные и комплектующие позиции: переносятся в расчётку как есть, без расчёта площади.
passthrough_keywords:
  - гибкая вставка
  - гибкие вставки
  - вставка гибкая
  - вставки гибкие
  - вибровставк
  - хомут
  - виброизолятор
  - вентилятор
  # вентиляторы по маркам (с номером — голое «вр» есть в «врезка» и «КВР»)
  - вр 80
  - вр-80
  - вр 280
  - вр-280
  - врп
  - вц 4
  - вц-4
  - вц 14
  # фильтры, аппараты очистки
  - фвг
  - фва
  - фкг
  - абсорбер
  # стальные клапаны и приводы
  - квр
  - кпу
  - клоп
  - огнезадерж
  - противопожар
  - дымоудал
  - ирисов
  # стальные шумоглушители по серии 5.904-17
  - гтк
  - гтп
  # электрика и автоматика
  - электродвигател
  - насос
  - шкаф управления
  - щит управления
  - щит автоматики
  - автоматик
  - частотн
  - датчик
  # крепёж
  - шпильк
  - анкер
  - дюбел
  - траверс
  - струбцин
  - перфолент
  - крепеж
  - крепёж
  # сетевое оборудование и покупные рукава
  - калорифер
  - нагревател
  - гибкий воздуховод

# Решётки: цена = 2 × цена заглушки того же сечения. Защитная сетка считается решёткой.
grid_keywords:
  - защитная сетка
  - сетка защитная
  - решётк

# Клапаны: цена = 2 × цена метра прямого участка. «Дроссель-клапан» уже содержит «клапан».
valve_keywords: []
