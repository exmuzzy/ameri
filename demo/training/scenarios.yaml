# Замеры «до/после обучения» Харнеса (prompts/industry-research.md, этапы 3 и 5): исполнитель — tools/training_via_api.py.
# Спецификация — каталог с spec.* и expected.yaml: реальные эталоны harness/evals/ или вымышленные demo/training/.
# Чаты называются «[До обучения] <title>» и «[После обучения] <title>»; ведёт их demo.manager.

specs:
  - key: himlab
    dir: harness/evals/himlab
    title: "Химлаборатория: «мп», сетка, зонт, покупные"
    connection: socket
    intro: "Замер: реальный запрос в Excel — метраж в «мп», защитная сетка, зонт, гибкие вставки и хомуты."
    request: "Посчитай, раструб."
  - key: order-142444
    dir: harness/evals/order-142444
    title: "Заказ в Word: «б=», «δ=», дроссель-клапаны"
    connection: socket
    intro: "Замер: реальный заказ в Word — толщины «б=», «δ=», тройники без ответвления, дроссель-клапаны."
    request: "Посчитай, раструб."
  - key: zakaz-plastik
    dir: harness/evals/zakaz-plastik
    title: "Система В1: торцы «раструб/труба», «фланец20»"
    connection: socket
    intro: "Замер: реальная заявка — система В1, соединения по торцам, «фланец20» у прямоугольного конца."
    request: "Посчитай, раструб."
  - key: sinonimy
    dir: demo/training/sinonimy
    title: "Синонимы: колено, полуотвод, «d×S», покупное по маркам"
    connection: socket
    intro: "Замер: вымышленная спецификация по ГОСТ 21.110 — колено, полуотвод, «250×3-Р», «315--250--315», «D315-Фу», покупное по маркам (ВР, КВР, ФВГ)."
    request: "Посчитай, раструб."
  - key: flancy
    dir: demo/training/flancy
    title: "Фланцы: короб, утка, врезка, «фланец20», м2"
    connection: flange
    intro: "Замер: вымышленная заявка на фланцах — «короб», утка, врезка, «фланец20», зонт над ванной, строка в м2, покупное (КПУ, ГТК, шкаф управления)."
    request: "Посчитай на фланцах."
  - key: b2b-rudnik-pp
    dir: harness/evals/b2b-rudnik-pp
    title: "Закупка рудника: «125х3х1500», крестовина, муфты, покупное"
    connection: socket
    intro: "Замер: открытый перечень позиций закупки — «125х3х1500», «90градусов», «полипропиленовый315х315х3», крестовина, муфты, вперемешку метизы, гибкие вставки и вентилятор."
    request: "Посчитай, раструб."

questions:
  - key: chem
    title: "Вопрос: химстойкость ПП в гальванике"
    text: >-
      Клиент — гальванический участок: ванны хромирования и травления в серной кислоте, раствор до 60 °C.
      Подойдут ли воздуховоды из ПП для вытяжки? Что ответить клиенту?
  - key: outdoor
    title: "Вопрос: ПП на улице зимой"
    text: >-
      Клиент хочет вывести воздуховод из ПП на улицу: Екатеринбург, зимой до −35 °C, летом на солнце.
      Выдержит ли ПП мороз и солнце? Что посоветовать?
  - key: flange20
    title: "Вопрос: что такое «фланец 20»"
    text: >-
      В спецификации строка «Переход ф450/600х300 – 1 шт – труба/фланец20». Что означает «фланец20»
      и что уточнить у клиента?
