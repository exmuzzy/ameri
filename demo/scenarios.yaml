# Демо-чаты на рабочем сайте: исполнитель — tools/demo_via_api.py, файлы — demo/specs/ (demo/build_specs.py).
# Всё вымышлено: компании, объекты, люди. Ответы ассистента даёт сайт (DeepSeek + прототип расчётки).
#
# Шаг — сообщение (as, action, text, files, connection) или оценка ответа (as, feedback).
#   action: ask | duct_calc | note;  connection: flange | socket | none (для duct_calc).
#   feedback относится к последнему ответу ассистента в чате; ответ с ошибкой сайта не оценивается.
# Реакции менеджера и руководителя (дописать данные к «красным» позициям, исправить ответ) записаны
# после прогона на сайте по фактическим ответам и расчёткам; в комментарии над шагом — на что реакция.
# followup — ещё одно сообщение, которое отправляет `--followup` (проверка, что чат можно продолжить).

users:
  manager: {login: demo.manager, name: Мария Демонстрационная, role: manager, password_env: AMERI_DEMO_MANAGER_PASSWORD}
  leader: {login: demo.leader, name: Павел Демонстрационный, role: leader, password_env: AMERI_DEMO_LEADER_PASSWORD}

scenarios:
  - id: 1
    title: "[Демо] Северный цех — Excel в погонных метрах"
    shows: расчётка из XLSX в «мп» с раструбом — нарезка метража, ниппель, зонт, защитная сетка, покупные позиции
    steps:
      - as: manager
        action: note
        text: >-
          Демо: клиент (ООО «Пример-Хим», Северный цех) прислал таблицу вытяжки В2 в погонных метрах.
          Показываю расчётку по Excel на раструбе: метраж режется на изделия, ниппель, зонт и защитная сетка
          считаются отдельно, гибкие вставки и хомуты идут как покупные.
      - as: manager
        action: duct_calc
        connection: socket
        text: Посчитай, соединение раструбное.
        files: [01-severnyj-ceh-v2.xlsx]
      - as: leader
        feedback: {rating: 1, comment: "Хорошо: метраж нарезан, покупные позиции не посчитаны по площади."}
    followup:
      as: manager
      action: ask
      text: Клиент спрашивает, сколько изделий получится из 12 мп ⌀315. Посмотри расчётку и ответь коротко.

  - id: 2
    title: "[Демо] Участок реагентов — Word с «б=» и «δ=»"
    shows: расчётка из DOCX с толщинами «б=»/«δ=», тройниками без размера ответвления и дроссель-клапанами, затем вопрос ассистенту
    steps:
      - as: manager
        action: note
        text: >-
          Демо: заявка в Word от ООО «Пример-Хим», участок реагентов. В строках толщины «б=3 мм», «δ=3»,
          тройники без второго размера и дроссель-клапаны. Сначала расчётка, потом спрошу ассистента,
          что может вызвать вопросы у производства.
      - as: manager
        action: duct_calc
        connection: socket
        text: Расчётка по заявке, раструб.
        files: [02-reagent-zakaz.docx]
      - as: manager
        action: ask
        text: Какие позиции в этой заявке могут вызвать вопросы у производства?
      # Ассистент просит второй размер у тройников и толщину у фасонных изделий, а у нас это
      # не вопросы: руководитель исправляет ответ и предлагает правило.
      - as: leader
        feedback:
          rating: -1
          comment: Тройники и толщины — не вопросы к клиенту, у нас на это есть правила.
          corrected_text: >-
            Вопросы у производства могут быть только по соединению: в заявке оно не указано, расчётка
            сделана на раструбе — если по проекту фланцы, пересчитаем. Остальное уточнять не нужно:
            тройник без второго размера («Тройник из ПП ф250») — равнопроходный, ответвление того же
            диаметра; где толщина не указана, она берётся из таблицы толщин по сечению; «б=3 мм» и «δ=3» —
            одно и то же, толщина стенки; дроссель-клапан считается как клапан того же сечения.
          rule_text: >-
            Тройник без второго размера — равнопроходный (ответвление того же диаметра), а толщина,
            если её нет в заявке, берётся из таблицы толщин. Не называй это вопросами к клиенту
            или производству.

  - id: 3
    title: "[Демо] Приток П2 — прямоугольная система на фланцах"
    shows: расчётка прямоугольной системы 400×300…1000×600 на фланцевом соединении
    steps:
      - as: manager
        action: note
        text: >-
          Демо: приток П2 административного корпуса, объект «Северный цех». Все воздуховоды прямоугольные,
          от 1000×600 до 400×300, соединение фланцевое. Показываю расчётку на фланцах по Markdown-таблице.
      - as: manager
        action: duct_calc
        connection: flange
        text: Посчитай на фланцах.
        files: [03-pritok-p2-flanec.md]

  - id: 4
    title: "[Демо] Склад В3 — «красные» позиции и уточнение"
    shows: позиции без данных (переход без второго сечения, отвод без размера) → уточнение у клиента → повторная расчётка
    steps:
      - as: manager
        action: note
        text: >-
          Демо: склад готовой продукции, система В3. В заявке есть переход ф315 без второго сечения и отвод
          без размера — расчётка не должна их угадывать. Покажу, как дописать данные и пересчитать.
      - as: manager
        action: duct_calc
        connection: socket
        text: Посчитай, раструб.
        files: [04-sklad-v3.docx]
      # В XLSX красные «Переход ПП ф315» (нет d_out) и «Отвод 90° ПП» (тип не распознан).
      - as: manager
        action: duct_calc
        connection: socket
        text: >-
          В расчётке красные переход ф315 (нет второго сечения) и отвод без размера. Уточнила у клиента:
          переход ф315/ф250 длиной 300 мм, отводы 90° ⌀250. Исправленный файл прикладываю, посчитай ещё раз.
        files: [04-sklad-v3-utochnenie.docx]

  - id: 5
    title: "[Демо] Химстойкость ПП — вопрос без файла"
    shows: вопрос ассистенту без файла (кислоты, работа на улице), затем текст для письма клиенту
    steps:
      - as: manager
        action: note
        text: >-
          Демо: клиент ООО «Пример-Хим» спрашивает, выдержит ли полипропилен кислотные пары и можно ли
          вести воздуховод по улице. Файла нет — просто вопрос ассистенту и текст для письма.
      - as: manager
        action: ask
        text: >-
          Клиент спрашивает: выдержит ли полипропиленовый воздуховод пары серной и соляной кислоты
          и можно ли прокладывать его на улице? Что ответить?
      - as: manager
        action: ask
        text: Переформулируй это для письма клиенту — вежливо, 5–7 предложений, без обещаний, которые мы не можем проверить.
      - as: leader
        feedback: {rating: 1, comment: "Хороший текст для письма."}
    followup:
      as: manager
      action: ask
      text: Клиент уточнил, что на улице участок 6 м. Что ему посоветовать про крепления и защиту от солнца — коротко?

  - id: 6
    title: "[Демо] Цех покраски — две системы в одном .odt"
    shows: расчётка из OpenDocument с двумя системами (В1 и П1) — колонка «СИСТЕМА» в расчётке
    steps:
      - as: manager
        action: note
        text: >-
          Демо: объект «Восточная площадка», цех покраски. В одном файле .odt две системы — «Система В1»
          и «Система П1». В расчётке они должны разойтись по колонке «СИСТЕМА».
      - as: manager
        action: duct_calc
        connection: socket
        text: Посчитай обе системы, раструб.
        files: [06-ceh-pokraski-v1-p1.odt]
      - as: manager
        action: ask
        text: >-
          Проверь по расчётке: какие позиции ушли в систему В1, а какие в П1? Клиент просит КП отдельно
          по каждой системе.

  - id: 7
    title: "[Демо] Три системы — большой CSV на 54 позиции"
    shows: расчётка большого CSV (54 строки, системы В1–В3)
    steps:
      - as: manager
        action: note
        text: >-
          Демо: выгрузка из проекта в CSV — 54 позиции трёх систем (В1, В2, В3): прямые участки, отводы,
          переходы, тройники, клапаны, покупные. Показываю, что расчётка справляется с длинным списком.
      - as: manager
        action: duct_calc
        connection: socket
        text: Посчитай весь список, раструб.
        files: [07-tri-sistemy-50-pozicij.csv]

  - id: 8
    title: "[Демо] Руководитель учит ассистента — защитная сетка"
    shows: 👎 и «Исправить и научить» от руководителя; правило уходит на утверждение на странице «Харнес»
    steps:
      - as: manager
        action: note
        text: >-
          Демо: вопрос про обозначение «защитная сетка». Руководитель оценит ответ ассистента и, если он
          неточный, исправит его и предложит правило — оно появится на странице «Харнес» на утверждение.
      - as: manager
        action: ask
        text: >-
          В заявке строка «Защитная сетка ⌀315 на выброс — 2 шт». Что это за изделие у нас и как его
          посчитает расчётка?
      - as: leader
        feedback:
          rating: -1
          comment: Ассистент не знает, что защитная сетка у нас — это решётка.
          corrected_text: >-
            «Защитная сетка ⌀315» — это решётка ПП того же сечения, ⌀315 (в КП пишем «Решетка ПП ф315»).
            Отдельное изделие не проектируем: расчётка считает её как решётку, цена — две заглушки того же
            сечения. Количество — 2 шт., как в заявке. Уточнять у клиента тип сетки не нужно.
          rule_text: >-
            «Защитная сетка ⌀N» — это решётка ПП того же сечения ⌀N (в КП — «Решетка ПП фN»); расчётка
            считает её как решётку. Не спрашивай у клиента тип сетки.
          as_example: true

  - id: 9
    title: "[Демо] Скидка и срок — переписка с руководителем"
    shows: переписка менеджера и руководителя в чате (без ассистента), затем вопрос ассистенту по этой переписке
    steps:
      - as: manager
        action: note
        text: >-
          Павел, клиент ООО «Пример-Хим» по Северному цеху просит скидку 10% и отгрузку за 10 рабочих дней.
          Объём — вытяжка В2 из соседнего чата. Что можем предложить?
      - as: leader
        action: note
        text: >-
          Мария, скидку даём 5% при предоплате 100%. Срок — 15 рабочих дней: 10 не успеем из-за очереди на
          сварке. Если клиенту критично, можем отгрузить прямые участки за 10 дней, фасонные — следом.
      - as: manager
        action: ask
        text: >-
          По переписке выше составь короткий ответ клиенту: условия скидки, срок и вариант с отгрузкой
          в две партии. Без лишних обещаний.
    followup:
      as: manager
      action: ask
      text: Клиент согласен на две партии. Составь короткое подтверждение, какие позиции уходят первой партией.

  - id: 10
    title: "[Демо] Учебный чат для новичка"
    shows: простая спецификация на 6 позиций, расчётка и объяснение предупреждений ассистентом
    steps:
      - as: manager
        action: note
        text: >-
          Демо для нового сотрудника: простая спецификация на 6 позиций (вытяжка из мойки). Делаю расчётку,
          потом прошу ассистента объяснить предупреждения простыми словами.
      - as: manager
        action: duct_calc
        connection: socket
        text: Посчитай, раструб.
        files: [10-uchebnaya.md]
      - as: manager
        action: ask
        text: Объясни предупреждения из расчётки простыми словами — что с ними делать новичку?
      - as: leader
        feedback: {rating: 1, comment: "Понятное объяснение для новичка."}
