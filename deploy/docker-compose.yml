name: ameri

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # Харнес — рабочая копия репозитория на томе /data: утверждённые правила переживают пересборку.
      # Чтобы правила уходили в GitHub, задайте в deploy/.env AMERI_GIT_URL с токеном и AMERI_GIT_PUSH=1.
      AMERI_GIT_URL: ${AMERI_GIT_URL:-https://github.com/exmuzzy/ameri.git}
      AMERI_GIT_PUSH: ${AMERI_GIT_PUSH:-0}
    volumes:
      - /srv/ameri/data:/data
      - /srv/ameri/duct-calc:/duct-calc:ro
    mem_limit: 3g

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      # Адрес HTTP API внутри compose; изменение окружения заставляет compose пересоздать caddy
      # и перечитать Caddyfile при обновлении.
      API_UPSTREAM: app:8000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
